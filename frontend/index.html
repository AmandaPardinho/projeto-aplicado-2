<!DOCTYPE html>
<html lang="pt-BR" data-theme="ametista">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Pilates — Painel</title>

    <!-- Tipografia: Bricolage Grotesque (títulos) + Hanken Grotesk (corpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <!-- Aplica o modo claro/escuro ANTES da tela pintar (evita "flash").
         Sem pref salva, segue o sistema operacional (prefers-color-scheme).
         A paleta é fixa (data-theme="ametista" no <html>). -->
    <script>
        (function () {
            var mode = localStorage.getItem("studio-mode")
                || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.dataset.mode = mode;
        })();
    </script>
</head>

<body>
    <div class="app">

        <!-- ===== Barra lateral: a "coluna" do studio + navegação por entidade ===== -->
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">Studio <strong>Pilates</strong></span>
            </div>
            <nav class="nav" id="nav" aria-label="Entidades"></nav>
            <div class="sidebar-foot">
                <button type="button" id="mode-toggle" class="mode-toggle" aria-pressed="false"><span>Modo escuro</span></button>
                <span class="foot-note">Painel administrativo · protótipo</span>
            </div>
        </aside>

        <!-- ===== Área principal ===== -->
        <main class="main">
            <header class="topbar">
                <p class="eyebrow">Cadastro</p>
                <h1 id="entity-title">Clientes</h1>
            </header>

            <div class="panel">
                <!-- Formulário (campos montados via JS conforme entidade + ação) -->
                <form id="crud-form" class="card form-card">
                    <div class="action-row">
                        <label for="action">Ação</label>
                        <select id="action" name="action">
                            <option value="create" selected>Cadastrar novo</option>
                            <option value="list">Listar todos</option>
                            <option value="get">Buscar por ID</option>
                            <option value="update">Atualizar</option>
                            <option value="delete">Excluir</option>
                        </select>
                    </div>

                    <div id="form-fields" class="form-fields"></div>
                    <p id="form-hint" class="form-hint"></p>

                    <button type="submit" class="btn-primary">Cadastrar</button>
                </form>

                <!-- Resposta crua do servidor -->
                <section class="card output-card">
                    <h2>Resposta do servidor</h2>
                    <div id="action-prompt" class="action-prompt hidden"></div>
                    <!-- data-state pinta status + corpo conforme o resultado (idle/loading/ok/error) -->
                    <div id="server-output" data-state="idle">
                        <!-- o aria-live fica no status: o leitor de tela anuncia "Sucesso"/"Erro",
                             não o JSON inteiro (que seria barulho) -->
                        <p class="output-status" aria-live="polite" aria-atomic="true">
                            <span class="status-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10" />
                                </svg>
                            </span>
                            <span class="status-label">Aguardando ação</span>
                        </p>
                        <pre id="output" class="output hidden"></pre>
                    </div>
                </section>
            </div>

            <!-- Tabela de listagem (aparece na ação "Listar") -->
            <section id="table-card" class="card table-card hidden">
                <h2 id="table-title">Registros</h2>
                <div class="table-wrap">
                    <table>
                        <thead id="table-head"></thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- IMask: máscaras de input (CDN, ~10kb). Cuida de cursor, apagar e colar. -->
    <script src="https://unpkg.com/imask@7/dist/imask.min.js"></script>
    <!-- Ordem importa: api → entities → app (o app usa os dois) -->
    <script src="js/api.js"></script>
    <script src="js/entities.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
