<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <h1>Studio Pilates — Painel de Cadastro de Cliente</h1>
    <p>Bem-vinda. Frontend funcionando!</p>

    <!-- Container que coloca o form e a saída lado a lado (flexbox) -->
    <div class="layout">

        <form>
            <!-- Combobox de ação — escolhe o método HTTP -->
            <div>
                <label for="action">Ação:</label>
                <select id="action" name="action">
                    <option value="create" selected>Cadastrar novo</option>
                    <option value="list">Listar todos</option>
                    <option value="get">Buscar por ID</option>
                    <option value="update">Atualizar</option>
                    <option value="delete">Excluir</option>
                </select>
            </div>

            <!-- ID — só aparece em get/update/delete -->
            <div class="field" data-actions="get update delete">
                <label for="client-id">ID (UUID):</label>
                <input id="client-id" name="id" type="text" placeholder="cole o UUID aqui">
            </div>

            <!-- Demais campos: aparecem em create/update -->
            <div class="field" data-actions="create update">
                <label for="client-name">Nome:</label>
                <input id="client-name" name="name" type="text" placeholder="Maria Silva">
            </div>

            <div class="field" data-actions="create update">
                <label for="client-cpf">CPF:</label>
                <input id="client-cpf" name="cpf" type="text" placeholder="000.000.000-00">
            </div>

            <div class="field" data-actions="create update">
                <label for="client-birth-date">Data de nascimento:</label>
                <input id="client-birth-date" name="birth_date" type="date">
            </div>

            <div class="field" data-actions="create update">
                <label for="client-whatsapp">Whatsapp:</label>
                <input id="client-whatsapp" name="whatsapp_number" type="text" placeholder="(11) 98765-4321">
            </div>

            <div class="field" data-actions="create update">
                <label for="client-email">E-mail:</label>
                <input id="client-email" name="email" type="email" placeholder="maria@exemplo.com">
            </div>

            <div class="field" data-actions="create update">
                <label for="client-status">Status:</label>
                <select id="client-status" name="client_status">
                    <option value="">— manter atual —</option>
                    <option value="prospect" selected>Prospecto</option>
                    <option value="active">Ativo</option>
                    <option value="inactive">Inativo</option>
                </select>
            </div>

            <div class="field" data-actions="create update">
                <label>
                    <input name="marketing_consent" type="checkbox" checked>
                    Aceita receber comunicações de marketing
                </label>
            </div>

            <!-- is_active — só update (pra reativar/desativar) -->
            <div class="field" data-actions="update">
                <label>
                    <input name="is_active" type="checkbox" checked>
                    Aluno Ativo (desmarque = desativado)
                </label>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <section class="output-block">
            <h2>Resposta do servidor:</h2>
            <pre id="output">Aguardando ação...</pre>
        </section>

    </div>

    <!-- Tabela de clientes — preenchida via JS quando a ação "list" roda -->
    <section class="table-block hidden" id="table-block">
        <h2>Clientes cadastrados</h2>
        <table id="clients-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>WhatsApp</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </section>

    <!-- IMask: biblioteca de máscaras de input (CDN, ~10kb). Cuida de cursor, apagar e colar. -->
    <script src="https://unpkg.com/imask@7/dist/imask.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
